services:
  app:
    build: .
    environment:
      PORT: "8000"
      GREETING: "${GREETING:-Hello, Docker!}"
      STORAGE: sqlite
      DATA_FILE: /data/sqlite/counter.db
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8000"
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/readyz', timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  sqlite_data:
